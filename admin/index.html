customCodeHeader":"\u003c!-- Astro Blog CMS Custom Header Code Slot --\u003e","customCodeFooter":"\u003c!-- Astro Blog CMS Custom Footer Code Slot --\u003e","adSlots":[{"id":"ad-header","name":"Header Banner","location":"header_banner","isEnabled":true,"bannerImageUrl":"https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=728&h=90&q=80","bannerLinkUrl":"https://cloudflare.com","altText":"Supercharge your edge deployments with Cloudflare D1 and Pages"},{"id":"ad-in-article","name":"In-Article Responsive Sponsor","location":"in_article","isEnabled":true,"bannerImageUrl":"https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=800&h=120&q=80","bannerLinkUrl":"https://astro.build","altText":"Build faster websites with Astro 5 Islands"},{"id":"ad-sidebar","name":"Sidebar Square Banner","location":"sidebar","isEnabled":true,"bannerImageUrl":"https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=300&h=250&q=80","bannerLinkUrl":"/how-to-create-facebook-reels-with-ai","altText":"Master AI video creation: View our comprehensive blueprint"},{"id":"ad-footer","name":"Footer Wide Billboard","location":"footer_banner","isEnabled":false}]},"posts":[{"id":"post-1","title":"How to Create Facebook Reels with AI: Complete 2026 Production Blueprint","slug":"how-to-create-facebook-reels-with-ai","excerpt":"Step-by-step masterclass on automating viral 9:16 vertical short-form video creation using prompt chaining, text-to-speech, and zero-cost cloud rendering.","content":"Facebook Reels have evolved into one of Meta's primary organic discovery drivers. With algorithmic preference strongly favoring high-velocity 9:16 vertical content, creators who manually edit every clip are quickly outpaced by teams using structured AI workflows.\n\nThis guide walks through building an end-to-end automated pipeline: from semantic prompt scripting, neural voiceover synthesis, and dynamic caption generation to automated render pipelines.\n\n\u003c!-- block:blk-1 --\u003e\n\n## The Three-Stage AI Reels Generation Pipeline\n\nTo create consistent, high-performing Facebook Reels without incurring exorbitant SaaS costs, we structure our pipeline into three distinct phases:\n\n1. **Script & Hook Generation**: Formulating curiosity gaps within the initial 1.8 seconds.\n2. **Audio & Dynamic Pacing**: Generating expressive voiceovers with synchronized word timestamps.\n3. **Visual Composition & Motion**: Combining b-roll, generative clips, and burn-in kinetic typography.\n\n\u003c!-- block:blk-2 --\u003e\n\n\u003c!-- block:blk-3 --\u003e\n\n## Automating Vertical Render with Cloud Pipelines\n\nTo scale production without burning out, headless rendering scripts turn raw scripts into ready-to-publish MP4 video files automatically:\n\n\u003c!-- block:blk-4 --\u003e\n\n## Strategic Trade-offs & Production Economics\n\nScaling short-form video requires balancing automation velocity against creative authenticity:\n\n\u003c!-- block:blk-5 --\u003e\n\n## Tooling Matrix & Performance Comparison\n\n\u003c!-- block:blk-6 --\u003e\n\n\u003c!-- block:blk-7 --\u003e\n\n## Frequently Asked Questions\n\n\u003c!-- block:blk-8 --\u003e\n\n\u003c!-- block:blk-9 --\u003e","blocks":[{"type":"takeaways","id":"blk-1","title":"Executive Summary & Key Takeaways","items":["The first 2.5 seconds dictate 84% of algorithmic retention on Facebook Reels.","Open-source toolchains combined with Cloudflare Workers enable $0 automated video batching.","Kinetic auto-captions increase muted watch time completion by up to 62%.","A single high-retention reel can be repurposed across Meta, YouTube Shorts, and TikTok with zero modifications."]},{"type":"prompt","id":"blk-2","promptText":"Act as a top 1% short-form video strategist for Facebook Reels. Write a viral 35-second script about: \"3 Counter-Intuitive Habits of Elite Developers\".\nFollow this strict format:\n[0-3s HOOK]: Visual action + provocative statement challenging standard advice.\n[3-15s POINT 1]: Rapid explanation with concrete analogy.\n[15-27s POINT 2 & 3]: The unexpected twist that creates comments.\n[27-35s CTA]: Specific question prompting viewers to debate in comments.\nTone: Authoritative, energetic, zero fluff, punchy sentences under 8 words.","modelTarget":"Gemini 2.5 Pro / Claude 3.7 Sonnet","notes":"Paste directly into your LLM orchestrator. Keep pacing at roughly 140 words per minute."},{"type":"info","id":"blk-3","title":"Algorithmic Retention Insight","content":"Facebook Reels algorithm heavily weights re-watch rates and comments. Creating an intentional point of discussion in the first 10 seconds boosts comment velocity, which signals high user engagement to Meta’s distribution engine."},{"type":"code","id":"blk-4","filename":"generate_reel_ffmpeg.sh","language":"bash","code":"# FFmpeg recipe: Scale 16:9 media to 9:16 with blurred ambient background & burned kinetic subtitles\nffmpeg -i input_clip.mp4 -filter_complex \\\n\"[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,boxblur=20:5[bg]; \\\n [0:v]scale=1080:1920:force_original_aspect_ratio=decrease[fg]; \\\n [bg][fg]overlay=(W-w)/2:(H-h)/2[composite]; \\\n [composite]subtitles=captions.srt:force_style='FontName=Montserrat,FontSize=18,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=3,Bold=1'[out]\" \\\n-map \"[out]\" -map 0:a? -c:v libx264 -preset fast -crf 20 -c:a aac -b:a 192k reel_output.mp4"},{"type":"pros_cons","id":"blk-5","pros":["Publish 10x more volume with consistent 1080x1920 vertical quality","Eliminates manual timeline editing and manual subtitling fatigue","Enables A/B testing multiple hooks for the exact same underlying topic","Extensible to programmatic publishing via Graph API"],"cons":["Over-relying on generic AI templates can trigger duplicate content filters","Requires initial setup of API keys and webhook orchestration","Human review is still crucial to ensure brand safety and factual accuracy"]},{"type":"table","id":"blk-6","caption":"Top AI Video Tools Benchmark for Facebook Reels (2026)","headers":["Platform / Tool","Strengths","Ideal For","Free Tier Quota"],"rows":[["CapCut Desktop AI","Fast kinetic typography, auto-reframe","Quick manual polish & captions","Generous Free Tier"],["FFmpeg + Whisper API","100% headless automation, zero lock-in","Programmatic batch pipelines","Self-hosted / Open Source"],["HeyGen / Synthesia","Hyper-realistic digital presenter avatars","Corporate & explainers","1 min free credit"],["Runway Gen-3 / Luma","Cinematic generative b-roll scenes","Visually arresting hooks","Free initial trials"]]},{"type":"warning","id":"blk-7","title":"Meta Community Standards & Copyright Warning","content":"Never use copyrighted audio tracks through third-party tools if you plan to monetize reels. Always utilize royalty-free sound effects or select official trending audio tracks inside the native Facebook app after uploading."},{"type":"faq","id":"blk-8","items":[{"id":"faq-1","question":"What is the optimal video length for Facebook Reels in 2026?","answer":"Data across millions of reels shows the sweet spot is between 25 and 45 seconds. While Meta supports up to 90 seconds, shorter punchy videos maintain a higher percentage of completion, which triggers algorithmic distribution."},{"id":"faq-2","question":"Will Facebook downrank videos with AI voiceovers?","answer":"No. Meta does not penalize AI voiceovers as long as the content provides real value, avoids misleading claims, and adheres to originality guidelines. High quality, expressive voices perform just as well as human voice tracks."},{"id":"faq-3","question":"How do I add captions that highlight word-by-word?","answer":"You can extract word-level timestamps using OpenAI Whisper with JSON output, then convert it to ASS (Advanced SubStation Alpha) subtitle format with karaoke tags (\\k), or use CapCut / AutoCap."}]},{"type":"cta","id":"blk-9","title":"Download the Production Prompt Pack","description":"Get our curated collection of 50+ tested hook templates and video prompts designed specifically for algorithmic retention.","buttonText":"Get the Free Prompt Pack","buttonUrl":"/contact?topic=prompts"}],"featuredImage":"https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&h=675&q=80","featuredImageCaption":"Automated 9:16 generative reel rendering pipeline","featuredImageAlt":"AI video generation and editing setup","status":"published","authorId":"user-author","categoryId":"cat-technology","tags":["artificial-intelligence","facebook-reels","video-automation","prompt-engineering"],"faqs":[{"id":"f1","question":"What is the optimal video length for Facebook Reels in 2026?","answer":"Data across millions of reels shows the sweet spot is between 25 and 45 seconds."},{"id":"f2","question":"Will Facebook downrank videos with AI voiceovers?","answer":"No, Meta does not penalize AI voiceovers as long as the content provides value."}],"seo":{"seoTitle":"How to Create Facebook Reels with AI: 2026 Guide & Pipeline","metaDescription":"Step-by-step guide to generating viral Facebook Reels using AI prompts, neural voiceovers, and automated FFmpeg video rendering.","focusKeyword":"create facebook reels with ai","secondaryKeywords":["facebook reels automation","ai video generation","viral reels prompt"],"canonicalUrl":"https://astroblog.dev/how-to-create-facebook-reels-with-ai","robotsIndex":true,"robotsFollow":true},"isFeatured":true,"isTrending":true,"views":14280,"readingTimeMinutes":7,"publishedAt":"2026-09-18T09:00:00Z","createdAt":"2026-09-17T11:00:00Z","updatedAt":"2026-09-20T14:30:00Z"},{"id":"post-2","title":"Zero-Cost Full-Stack Architecture: Astro + Cloudflare D1 + R2 Blueprint","slug":"zero-cost-fullstack-astro-cloudflare-d1","excerpt":"How we engineered a high-throughput CMS and public blog that handles millions of pageviews per month on Cloudflare’s free tier without paying a single dollar for servers.","content":"When designing the infrastructure for a high-volume digital publication, the default impulse is often to provision managed PostgreSQL databases, dedicated Redis clusters, and auto-scaling container fleets on AWS or GCP.\n\nHowever, for 98% of content-driven websites, this is financial and architectural overkill. By combining Astro's static build optimization with Cloudflare Pages, D1 (edge SQLite), and R2 (S3-compatible asset storage), you can achieve enterprise-tier performance with exactly ₹0 / $0 monthly hosting expenses.\n\n\u003c!-- block:blk-cf-1 --\u003e\n\n## Why Astro + Cloudflare D1 is the Ultimate Pairing\n\nAstro excels at generating ultra-fast HTML at build time, hydration islands for interactive components, and server endpoints for admin writes.\n\nCloudflare D1 is a serverless relational database built on SQLite distributed worldwide across Cloudflare's 300+ city edge network. Reads are near-instantaneous, and writes are managed through an Raft consensus protocol.\n\n\u003c!-- block:blk-cf-2 --\u003e\n\n\u003c!-- block:blk-cf-3 --\u003e\n\n## Infrastructure Breakdown & Cost Modeling\n\n\u003c!-- block:blk-cf-4 --\u003e\n\n\u003c!-- block:blk-cf-5 --\u003e","blocks":[{"type":"takeaways","id":"blk-cf-1","title":"Core Architectural Advantages","items":["Astro pre-renders public articles as static HTML, serving them directly from Cloudflare global edge cache.","CMS write operations interact with Cloudflare D1 via lightweight serverless edge endpoints.","Media files (images, audio) reside on Cloudflare R2 with zero egress fees.","Free-tier allowance includes 5 million read units/day on D1 and 10GB of R2 storage."]},{"type":"code","id":"blk-cf-2","filename":"schema.sql","language":"sql","code":"-- Cloudflare D1 Production CMS Schema\nCREATE TABLE IF NOT EXISTS posts (\n  id TEXT PRIMARY KEY,\n  title TEXT NOT NULL,\n  slug TEXT UNIQUE NOT NULL,\n  excerpt TEXT,\n  content TEXT NOT NULL,\n  blocks_json TEXT,\n  featured_image TEXT,\n  status TEXT DEFAULT 'draft',\n  author_id TEXT NOT NULL,\n  category_id TEXT NOT NULL,\n  seo_json TEXT,\n  views INTEGER DEFAULT 0,\n  published_at DATETIME,\n  created_at DATETIME DEFAULT CURRENT_TIMESTAMP,\n  updated_at DATETIME DEFAULT CURRENT_TIMESTAMP\n);\n\nCREATE INDEX idx_posts_slug ON posts(slug);\nCREATE INDEX idx_posts_status ON posts(status);\nCREATE INDEX idx_posts_category ON posts(category_id);"},{"type":"info","id":"blk-cf-3","title":"Cloudflare D1 Free Tier Quotas","content":"Cloudflare D1 provides 5,000,000 read units per day and 100,000 write units per day on the completely free plan. Since public reads hit edge cache, only admin changes and search uncached misses touch D1, easily supporting 1M+ monthly visitors on free tiers."},{"type":"table","id":"blk-cf-4","caption":"Zero-Cost Infrastructure Stack Breakdown","headers":["Layer","Provider","Service","Cost at 1M Views"],"rows":[["Frontend & SSR","Cloudflare Pages","Astro Pages Adapter","₹0 / $0"],["Relational Database","Cloudflare","D1 (Serverless SQLite)","₹0 / $0"],["Media & Images","Cloudflare","R2 Storage (0 Egress Fees)","₹0 / $0"],["DNS, SSL & CDN","Cloudflare","Global Edge Network","₹0 / $0"],["Source Control & CI/CD","GitHub","GitHub Actions","₹0 / $0"]]},{"type":"tip","id":"blk-cf-5","title":"Pro-Tip: Cache Busting with Webhooks","content":"When an editor clicks \"Publish\" in the CMS, invoke Cloudflare’s Purge Cache API for the specific article slug instead of purging everything. This guarantees 100% cache hits for the rest of your site."}],"featuredImage":"https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=1200&h=675&q=80","featuredImageCaption":"Global edge computing topology diagram","featuredImageAlt":"Serverless Cloudflare edge network infrastructure","status":"published","authorId":"user-superadmin","categoryId":"cat-cloudflare","tags":["cloudflare","cloudflare-d1","astro","zero-cost"],"seo":{"seoTitle":"Zero-Cost Full-Stack Architecture: Astro + Cloudflare D1","metaDescription":"Complete technical architecture guide to launching a production blog on Cloudflare Pages, D1, and R2 with zero hosting expenses.","focusKeyword":"astro cloudflare d1","secondaryKeywords":["zero cost web architecture","serverless sqlite","cloudflare pages astro"],"canonicalUrl":"https://astroblog.dev/zero-cost-fullstack-astro-cloudflare-d1","robotsIndex":true,"robotsFollow":true},"isFeatured":true,"isTrending":true,"views":9840,"readingTimeMinutes":6,"publishedAt":"2026-09-12T16:00:00Z","createdAt":"2026-09-10T14:00:00Z","updatedAt":"2026-09-19T10:00:00Z"},{"id":"post-3","title":"Astro 5 Islands & Content Collections: Deep Dive into Zero-JS Baselines","slug":"astro-5-islands-content-collections-deep-dive","excerpt":"Explore how Astro 5 redefines editorial publishing with partial hydration, type-safe content schemas, and lighting-fast Lighthouse 100 scores.","content":"Modern web users demand immediate responsiveness. Yet the typical SPA blog loads multiple megabytes of JavaScript just to display static text and an image.\n\nAstro 5 changes the game with its \"Islands Architecture\". By defaulting to pure server-rendered HTML and isolating client-side interactivity to designated islands, your core article content requires literally zero JavaScript.\n\n## Understanding Island Hydration Directives\n\nIn Astro, every component is rendered to static HTML at build time or on the server edge. You only hydrate what requires interactivity using explicit client directives:\n\n- `client:load`: Hydrates immediately on page load (use sparingly, e.g. for search bars).\n- `client:idle`: Hydrates once the browser is idle (ideal for table of contents).\n- `client:visible`: Hydrates when the element enters the viewport (perfect for comments & social share tools).\n- `client:media`: Hydrates conditionally based on CSS media queries.","blocks":[{"type":"takeaways","id":"blk-as-1","title":"Key Architectural Takeaways","items":["Zero-JS baseline guarantees perfect 100/100 Google Core Web Vitals.","Content Collections validate frontmatter and metadata with Zod schemas.","Island hydration prevents whole-page JavaScript bloat.","Seamless integration with React, Vue, Svelte, or Solid components in the same codebase."]},{"type":"code","id":"blk-as-2","filename":"src/content/config.ts","language":"typescript","code":"import { defineCollection, z } from 'astro:content';\n\nconst blogCollection = defineCollection({\n  type: 'content',\n  schema: z.object({\n    title: z.string().max(80),\n    description: z.string().max(160),\n    pubDate: z.date(),\n    author: z.string(),\n    category: z.string(),\n    tags: z.array(z.string()),\n    featuredImage: z.string().url(),\n    isDraft: z.boolean().default(false),\n  }),\n});\n\nexport const collections = {\n  blog: blogCollection,\n};"},{"type":"pros_cons","id":"blk-as-3","pros":["Instant First Contentful Paint (\u003c0.2s) even on slow 3G mobile networks","Strict compile-time schema validation prevents broken metadata","Zero client-side bundle for pure typography & article reading"],"cons":["Mental model shift for developers accustomed to full-page SPA routers","Shared state between disconnected islands requires nanostores or custom events"]}],"featuredImage":"https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=1200&h=675&q=80","featuredImageCaption":"Astro 5 zero-javascript island architecture","featuredImageAlt":"Code streams depicting clean server-rendered HTML","status":"published","authorId":"user-admin","categoryId":"cat-architecture","tags":["astro","web-architecture","seo"],"seo":{"seoTitle":"Astro 5 Islands & Content Collections: Deep Dive","metaDescription":"Comprehensive guide to Astro 5 architecture, island hydration, and building Lighthouse 100 websites.","focusKeyword":"astro 5 islands","secondaryKeywords":["astro content collections","zero js web architecture"],"robotsIndex":true,"robotsFollow":true},"isFeatured":false,"isTrending":true,"views":6420,"readingTimeMinutes":5,"publishedAt":"2026-09-05T10:00:00Z","createdAt":"2026-09-04T12:00:00Z","updatedAt":"2026-09-05T10:00:00Z"},{"id":"post-4","title":"Prompt Engineering Playbook for High-Converting Social Shorts","slug":"prompt-engineering-playbook-social-shorts","excerpt":"Field-tested prompt chains to craft high-retention hooks, compelling visual beats, and viral retention loops across TikTok, Reels, and YouTube Shorts.","content":"Crafting high-converting short-form video scripts is no longer about guessing what works. It is about systematically engineering curiosity loops and emotional resonance into the script structure.\n\nIn this playbook, we break down our proprietary prompt formulas tested across 200+ viral short videos with verified retention analytics.","blocks":[{"type":"prompt","id":"blk-pe-1","promptText":"Act as a master viral scriptwriter. Analyze this core concept: [INSERT TOPIC].\nGenerate 5 distinct opening hooks using these specific psychological triggers:\n1. The Absurd Contrast: \"Everyone thinks X, but the top 1% secretly do Y...\"\n2. The Urgent Loss Aversion: \"Stop doing X right now if you want to avoid...\"\n3. The Insider Leaked Secret: \"A senior engineer at [Company] just showed me how...\"\n4. The Impossible Speed Challenge: \"Here is how to do [Complex Task] in under 60 seconds...\"\n5. The Pattern Interrupt Question: \"Why does nobody talk about this fatal mistake?\"\nFor each hook, include the exact visual cue description for the editor.","modelTarget":"Claude 3.7 / Gemini 2.5 Flash","notes":"Produces high-converting 3-second opening beats with specific camera cues."},{"type":"tip","id":"blk-pe-2","title":"The \"Two-Second Rule\"","content":"Viewers make a subconscious decision to swipe or stay within 1.8 to 2.2 seconds. Ensure the spoken hook begins at millisecond 0, accompanied by a dynamic visual change (zoom, text pop, or unexpected motion)."}],"featuredImage":"https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=1200&h=675&q=80","featuredImageCaption":"Analytics dashboard tracking retention curves across short-form platforms","featuredImageAlt":"Data analytics charts showing audience retention metrics","status":"published","authorId":"user-author","categoryId":"cat-technology","tags":["prompt-engineering","artificial-intelligence","facebook-reels"],"seo":{"seoTitle":"Prompt Engineering Playbook for High-Converting Social Shorts","metaDescription":"Field-tested prompt formulas and hook architectures for TikTok, Facebook Reels, and YouTube Shorts.","focusKeyword":"prompt engineering social shorts","robotsIndex":true,"robotsFollow":true},"isFeatured":false,"isTrending":false,"views":4190,"readingTimeMinutes":4,"publishedAt":"2026-08-28T08:00:00Z","createdAt":"2026-08-27T10:00:00Z","updatedAt":"2026-08-28T08:00:00Z"},{"id":"post-5","title":"Automated SEO Audit & Schema Generation with Astro SSR","slug":"automated-seo-audit-schema-generation-astro","excerpt":"How to dynamically inject valid Article, FAQPage, and BreadcrumbList JSON-LD schemas into Astro pages for maximum search visibility.","content":"Search engines are becoming increasingly reliant on structured data to parse content intent, rich snippets, and answer boxes in AI search overviews.\n\nIn this guide, we demonstrate how to build an automated schema engine inside Astro that reads your CMS posts and injects verified JSON-LD markup directly into the HTML head.","blocks":[{"type":"info","id":"blk-seo-1","title":"Why Schema.org Matters in 2026","content":"AI search engines (Google AI Overviews, Perplexity, Bing Copilot) utilize structured JSON-LD entities to synthesize answers. Valid structured schemas increase citation probability by over 300%."},{"type":"code","id":"blk-seo-2","filename":"src/components/JsonLd.astro","language":"html","code":"---\nexport interface Props {\n  article: any;\n  siteUrl: string;\n}\nconst { article, siteUrl } = Astro.props;\n\nconst schema = {\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"BlogPosting\",\n  \"headline\": article.seo.seoTitle || article.title,\n  \"description\": article.seo.metaDescription || article.excerpt,\n  \"image\": article.featuredImage,\n  \"datePublished\": article.publishedAt,\n  \"dateModified\": article.updatedAt,\n  \"author\": {\n    \"@type\": \"Person\",\n    \"name\": article.author.name\n  },\n  \"publisher\": {\n    \"@type\": \"Organization\",\n    \"name\": \"Astro Blog CMS\",\n    \"logo\": {\n      \"@type\": \"ImageObject\",\n      \"url\": `${siteUrl}/logo.png`\n    }\n  },\n  \"mainEntityOfPage\": {\n    \"@type\": \"WebPage\",\n    \"@id\": `${siteUrl}/${article.slug}`\n  }\n};\n---\n\u003cscript type=\"application/ld+json\" set:html={JSON.stringify(schema)} /\u003e"}],"featuredImage":"https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&w=1200&h=675&q=80","featuredImageCaption":"Search engine spider and semantic web entity indexing","featuredImageAlt":"Abstract graphic representing structured data and search indexation","status":"draft","authorId":"user-editor","categoryId":"cat-workflows","tags":["seo","astro"],"seo":{"seoTitle":"Automated SEO Audit & Schema Generation with Astro SSR","metaDescription":"Learn how to generate Article, Breadcrumb, and FAQ JSON-LD schemas automatically in Astro.","robotsIndex":false,"robotsFollow":true},"views":0,"readingTimeMinutes":5,"createdAt":"2026-09-22T14:00:00Z","updatedAt":"2026-09-23T11:20:00Z"}],"categories":[{"id":"cat-technology","name":"Technology & AI","slug":"technology","description":"Generative AI workflows, automation pipelines, video generation, and machine learning utilities.","color":"#6366f1","seoTitle":"Technology & Artificial Intelligence Articles - Astro Blog CMS","metaDescription":"Explore deep-dive guides on AI content creation, automated pipelines, and modern developer toolchains."},{"id":"cat-architecture","name":"Web Architecture","slug":"web-architecture","description":"Serverless foundations, zero-JavaScript baselines, Astro island architecture, and CDN performance.","color":"#10b981","seoTitle":"Modern Web Architecture & Astro Guides","metaDescription":"In-depth architectural analyses on island hydration, caching layers, and high-performance publishing."},{"id":"cat-cloudflare","name":"Cloudflare & Edge","slug":"cloudflare-edge","description":"Zero-cost infrastructure, Cloudflare D1 SQL, R2 media distribution, and Edge Workers.","color":"#f59e0b","seoTitle":"Cloudflare D1 & Edge Computing Guides","metaDescription":"Deploy scalable, zero-cost production web applications using Cloudflare Workers, Pages, and D1."},{"id":"cat-workflows","name":"Developer Workflows","slug":"workflows","description":"GitOps strategies, SEO automation, CMS pipelines, and production release checklists.","color":"#3b82f6","seoTitle":"Developer Workflows & Publishing Automation","metaDescription":"Actionable blueprints for technical content teams, automated deployments, and editorial governance."}],"tags":[{"id":"tag-ai","name":"Artificial Intelligence","slug":"artificial-intelligence"},{"id":"tag-reels","name":"Facebook Reels","slug":"facebook-reels"},{"id":"tag-astro","name":"Astro","slug":"astro"},{"id":"tag-cloudflare","name":"Cloudflare","slug":"cloudflare"},{"id":"tag-d1","name":"Cloudflare D1","slug":"cloudflare-d1"},{"id":"tag-seo","name":"SEO & Structured Data","slug":"seo"},{"id":"tag-video","name":"Video Automation","slug":"video-automation"},{"id":"tag-prompt","name":"Prompt Engineering","slug":"prompt-engineering"},{"id":"tag-zero-cost","name":"Zero Cost","slug":"zero-cost"}],"pages":[{"id":"page-about","title":"About Astro Blog CMS","slug":"about","content":"## The Next-Generation Publishing Platform\n\nAstro Blog CMS was engineered to solve a fundamental problem in modern web publishing: **the trade-off between editorial velocity and website performance**.\n\nTraditional platforms like WordPress rely on heavy PHP servers, fragile plugins, and bloated database queries for every pageview. Conversely, headless JAMstack setups often force editors to edit raw markdown files or trigger slow 15-minute static rebuilds for a single typo fix.\n\n### Our Architecture\n\nWe combine the best of both paradigms:\n\n- **Lightning-Fast Astro Frontend**: Pure zero-JavaScript baseline by default with selective island hydration.\n- **Full-Featured Headless CMS**: Built-in rich article editor, special blocks (AI prompts, code blocks, tables, callouts), media manager, and revision history.\n- **Edge Data Persistence**: Powered by Cloudflare D1 distributed SQLite and R2 storage.\n- **Zero-Cost Scaling**: Architected from the ground up to operate within generous free-tier quotas while effortlessly absorbing viral traffic spikes.\n\n### The Team\n\nWe are a distributed group of software architects, content strategists, and performance obsessives committed to making the web faster, cleaner, and more accessible.","seoTitle":"About Us – Astro Blog CMS Publishing Architecture","metaDescription":"Learn about Astro Blog CMS: the high-performance publishing platform powered by Astro, Cloudflare D1, and zero-cost edge infrastructure.","isPublished":true,"updatedAt":"2026-09-15T10:00:00Z"},{"id":"page-contact","title":"Contact Us","slug":"contact","content":"## Get in Touch\n\nHave questions about our publishing architecture, editorial submissions, or open-source tools? We’d love to hear from you.\n\n### Editorial & Technical Inquiries\n- **General Support**: editorial@astroblog.dev\n- **Press & Partnerships**: partnerships@astroblog.dev\n- **Security & Vulnerability Reports**: security@astroblog.dev\n\n### Office & Hours\nOur core team operates asynchronously across San Francisco, London, and Tokyo. We typically reply within 24 hours Monday through Friday.","seoTitle":"Contact Us – Astro Blog CMS","metaDescription":"Reach out to the Astro Blog CMS team for editorial submissions, technical support, and architectural inquiries.","isPublished":true,"updatedAt":"2026-09-15T10:00:00Z"},{"id":"page-privacy","title":"Privacy Policy","slug":"privacy-policy","content":"## Privacy Policy\n*Effective Date: September 2026*\n\nYour privacy is paramount. Astro Blog CMS operates under a strict privacy-first principle:\n\n1. **No Invasive Trackers**: We do not use third-party behavioral trackers or sell personal browsing information to advertisers.\n2. **Aggregated Analytics**: Performance metrics collected are anonymized and processed without storing personal identifiers or persistent cross-site cookies.\n3. **Data Protection**: Any personal information provided through newsletter signups or contact forms is encrypted in transit and at rest.\n4. **Your Rights**: You retain the right to inspect, correct, or request deletion of any submitted email addresses or user accounts at any time.","seoTitle":"Privacy Policy – Astro Blog CMS","metaDescription":"Privacy policy and data protection principles for Astro Blog CMS.","isPublished":true,"updatedAt":"2026-09-01T12:00:00Z"},{"id":"page-terms","title":"Terms of Service","slug":"terms","content":"## Terms of Service\n*Effective Date: September 2026*\n\nBy accessing Astro Blog CMS and utilizing our website, public articles, or CMS services, you agree to these Terms of Service.\n\n- **Content License**: All original technical tutorials, architecture diagrams, and prompt templates are published under standard attribution licenses unless explicitly designated otherwise.\n- **Fair Use**: Code samples and FFmpeg scripts may be freely used in your personal and commercial software projects without attribution.\n- **Disclaimer**: Content is provided \"as is\" for informational and educational purposes without warranty.","seoTitle":"Terms of Service – Astro Blog CMS","metaDescription":"Terms of service and content usage guidelines for Astro Blog CMS.","isPublished":true,"updatedAt":"2026-09-01T12:00:00Z"},{"id":"page-disclaimer","title":"Disclaimer","slug":"disclaimer","content":"## Disclaimer\n*Effective Date: September 2026*\n\nAll tutorials, architectural guides, and software specifications on Astro Blog CMS reflect the opinions and testing methodologies of the respective authors.\n\n- **Infrastructure Pricing**: Free tier quotas and cloud provider policies (Cloudflare, GitHub, AWS) are subject to change at the provider's discretion.\n- **External Links**: We are not responsible for the contents or security practices of external third-party sites linked from our articles.","seoTitle":"Disclaimer – Astro Blog CMS","metaDescription":"Editorial and infrastructure disclaimer for Astro Blog CMS.","isPublished":true,"updatedAt":"2026-09-01T12:00:00Z"}],"menus":[{"id":"m-home","label":"Home","url":"/","order":1},{"id":"m-tech","label":"AI & Reels","url":"/category/technology","order":2},{"id":"m-arch","label":"Architecture","url":"/category/web-architecture","order":3},{"id":"m-edge","label":"Cloudflare D1","url":"/category/cloudflare-edge","order":4},{"id":"m-about","label":"About","url":"/about","order":5},{"id":"m-contact","label":"Contact","url":"/contact","order":6}],"users":[{"id":"user-superadmin","name":"Alex Thorne","email":"alex.thorne@astroblog.dev","avatar":"https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=240&h=240&q=80","role":"Super Admin","title":"Lead Architect & Systems Engineer","bio":"Systems engineer obsessed with Astro, edge compute, and sub-100ms first-contentful-paint architectures.","twitter":"https://x.com/alexthorne_dev","github":"https://github.com/alexthorne","createdAt":"2026-01-15T10:00:00Z"},{"id":"user-admin","name":"Maya Lin","email":"maya.lin@astroblog.dev","avatar":"https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=240&h=240&q=80","role":"Admin","title":"Senior Content Strategist & Technical Editor","bio":"Editorial director and digital product lead. Writing about the convergence of machine intelligence and modern publishing.","twitter":"https://x.com/mayalin_writes","github":"https://github.com/mayalin","createdAt":"2026-02-01T11:20:00Z"},{"id":"user-editor","name":"Julian Ross","email":"julian.ross@astroblog.dev","avatar":"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=240&h=240&q=80","role":"Editor","title":"Managing Editor","bio":"Specialist in search engine optimization, content verification, and technical copy review.","createdAt":"2026-03-05T09:15:00Z"},{"id":"user-author","name":"Priya Sharma","email":"priya.sharma@astroblog.dev","avatar":"https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=240&h=240&q=80","role":"Author","title":"Full-Stack & AI Pipeline Engineer","bio":"Building automated video workflows, generative prompts, and Cloudflare edge microservices.","twitter":"https://x.com/priyasharma_ai","createdAt":"2026-04-10T14:45:00Z"},{"id":"user-contributor","name":"David Kim","email":"david.kim@astroblog.dev","avatar":"https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=240&h=240&q=80","role":"Contributor","title":"Junior Technical Writer","bio":"Passionate about open-source tooling, web standards, and developer productivity hacks.","createdAt":"2026-05-18T16:00:00Z"}],"redirects":[{"id":"red-1","fromPath":"/articles/facebook-reels-ai","toPath":"/how-to-create-facebook-reels-with-ai","type":301,"hits":242,"createdAt":"2026-09-18T10:00:00Z"},{"id":"red-2","fromPath":"/blog/zero-cost-astro","toPath":"/zero-cost-fullstack-astro-cloudflare-d1","type":301,"hits":118,"createdAt":"2026-09-14T08:00:00Z"}],"githubUser":"amitsi07","githubRepo":"my-astro-blog"}</script>

  <script>
    // Global Error Catcher to ensure screen is NEVER blank
    window.addEventListener('error', function(e) {
      console.error('Admin Studio Error Caught:', e);
      const main = document.getElementById('mainContent');
      if (main && (!main.innerHTML || main.innerHTML.includes('Loading Admin Studio'))) {
        main.innerHTML = `
          <div class="p-6 rounded-2xl bg-slate-900 border border-rose-500/40 text-left space-y-4 my-4">
            <div class="flex items-center gap-2 text-rose-400 font-bold text-base">
              <span>⚠️</span>
              <span>Dashboard Initialization Notice</span>
            </div>
            <p class="text-xs text-slate-300">${e.message || 'An error was encountered while loading cached data.'}</p>
            <div class="pt-2 flex gap-3">
              <button onclick="localStorage.removeItem('astro_edge_cms_state');location.reload();" class="px-4 py-2 rounded-xl bg-orange-600 hover:bg-orange-500 text-white font-bold text-xs shadow">
                🔄 Clear Local Cache & Reload
              </button>
            </div>
          </div>
        `;
      }
    });

    // Parse Data Safely from JSON Block
    let APP_DATA = {};
    try {
      const dataEl = document.getElementById('cms-initial-data');
      if (dataEl) {
        APP_DATA = JSON.parse(dataEl.textContent || '{}');
      }
    } catch (err) {
      console.error('Failed to parse initial json', err);
    }

    // Defensive Data Fallbacks
    if (!APP_DATA.settings || typeof APP_DATA.settings !== 'object') APP_DATA.settings = {};
    if (!APP_DATA.posts || !Array.isArray(APP_DATA.posts)) APP_DATA.posts = [];
    if (!APP_DATA.categories || !Array.isArray(APP_DATA.categories)) APP_DATA.categories = [];
    if (!APP_DATA.tags || !Array.isArray(APP_DATA.tags)) APP_DATA.tags = [];
    if (!APP_DATA.pages || !Array.isArray(APP_DATA.pages)) APP_DATA.pages = [];
    if (!APP_DATA.menus || !Array.isArray(APP_DATA.menus)) APP_DATA.menus = [];
    if (!APP_DATA.users || !Array.isArray(APP_DATA.users)) APP_DATA.users = [];
    if (!APP_DATA.redirects || !Array.isArray(APP_DATA.redirects)) APP_DATA.redirects = [];

    // Load locally cached edits if any
    try {
      const stored = localStorage.getItem('astro_edge_cms_state');
      if (stored) {
        const parsed = JSON.parse(stored);
        if (parsed && typeof parsed === 'object') {
          if (parsed.settings) APP_DATA.settings = Object.assign(APP_DATA.settings, parsed.settings);
          if (Array.isArray(parsed.posts) && parsed.posts.length > 0) APP_DATA.posts = parsed.posts;
          if (Array.isArray(parsed.categories) && parsed.categories.length > 0) APP_DATA.categories = parsed.categories;
          if (Array.isArray(parsed.tags)) APP_DATA.tags = parsed.tags;
          if (Array.isArray(parsed.pages) && parsed.pages.length > 0) APP_DATA.pages = parsed.pages;
          if (Array.isArray(parsed.menus) && parsed.menus.length > 0) APP_DATA.menus = parsed.menus;
          if (Array.isArray(parsed.users) && parsed.users.length > 0) APP_DATA.users = parsed.users;
          if (Array.isArray(parsed.redirects)) APP_DATA.redirects = parsed.redirects;
        }
      }
    } catch (e) {
      console.error('Failed to parse cached state', e);
    }

    function saveState() {
      try {
        localStorage.setItem('astro_edge_cms_state', JSON.stringify({
          settings: APP_DATA.settings,
          posts: APP_DATA.posts,
          categories: APP_DATA.categories,
          tags: APP_DATA.tags,
          pages: APP_DATA.pages,
          menus: APP_DATA.menus,
          users: APP_DATA.users,
          redirects: APP_DATA.redirects,
        }));
      } catch (err) {
        console.error('Failed to save state to localStorage', err);

    function showToast(msg, isSuccess = true) {
      const box = document.getElementById('toastBox');
      const icon = document.getElementById('toastIcon');
      const text = document.getElementById('toastMsg');
      if (!box || !icon || !text) return;
      icon.innerText = isSuccess ? '✓' : '⚠️';
      icon.className = isSuccess ? 'text-emerald-400 font-bold' : 'text-rose-400 font-bold';
      text.innerText = msg;
      box.classList.remove('hidden');
      setTimeout(() => box.classList.add('hidden'), 3500);
    }

    function toggleMobileDrawer() {

    function parseMarkdownSafe(md) {
      if (typeof marked !== 'undefined' && typeof marked.parse === 'function') {
        try {
          return marked.parse(md || '');
        } catch (e) {
          console.error(e);
        }
      }
      return (md || '')
        .replace(/^### (.*$)/gim, '<h3 class="text-lg font-bold text-white my-2">$1</h3>')
        .replace(/^## (.*$)/gim, '<h2 class="text-xl font-bold text-white my-3">$1</h2>')
        .replace(/^# (.*$)/gim, '<h1 class="text-2xl font-bold text-white my-4">$1</h1>')
        .replace(/\*\*(.*?)\*\*/gim, '<strong class="text-white">$1</strong>')
        .replace(/\*(.*?)\*/gim, '<em class="text-slate-300">$1</em>')
        .replace(/\n/gim, '<br />');

            <span>${item.label}</span>

    function switchTab(tab) {
      activeTab = tab;
      editingPostId = null;
      const drawer = document.getElementById('mobileDrawer');
      if (drawer) drawer.classList.add('hidden');

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-orange-600', 'text-white', 'shadow-md', 'font-semibold');
        btn.classList.add('text-slate-300');

      });

      renderCurrentTab();
    }

    function renderCurrentTab() {
      const main = document.getElementById('mainContent');
      if (!main) return;

      try {
        if (editingPostId !== null) {
          renderFullPostEditor(editingPostId);
          return;
        }

        switch (activeTab) {
          case 'dashboard': renderDashboard(main); break;
          case 'posts': renderPosts(main); break;
          case 'categories': renderCategories(main); break;
          case 'homepage': renderHomepageBuilder(main); break;
          case 'media': renderMedia(main); break;
          case 'pages': renderPages(main); break;
          case 'menus': renderMenus(main); break;
          case 'users': renderUsers(main); break;
          case 'redirects': renderRedirects(main); break;
          case 'ads': renderAds(main); break;
          case 'settings': renderSettings(main); break;
          case 'seo': renderSeo(main); break;
          default: renderDashboard(main);

    function handleTitleInput(val, isNew) {
      if (isNew) {
        const slug = val.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        const slugEl = document.getElementById('postSlug');
        if (slugEl) slugEl.value = slug;
        const serpSlug = document.getElementById('serpSlugPreview');
        if (serpSlug) serpSlug.innerText = slug || 'article';
      }
      updateSerpPreview();
    }

    function updateSerpPreview() {
      const titleInput = document.getElementById('postSeoTitle');
      const descInput = document.getElementById('postSeoDesc');
      const titleMain = document.getElementById('postTitle');
      const excerptMain = document.getElementById('postExcerpt');

      const title = (titleInput && titleInput.value) || (titleMain && titleMain.value) || 'Your Article Title';
      const desc = (descInput && descInput.value) || (excerptMain && excerptMain.value) || 'Article summary preview...';

      const serpTitle = document.getElementById('serpTitlePreview');
      const serpDesc = document.getElementById('serpDescPreview');
      const titleCounter = document.getElementById('seoTitleCount');
      const descCounter = document.getElementById('seoDescCount');

      if (serpTitle) serpTitle.innerText = title;
      if (serpDesc) serpDesc.innerText = desc;
      if (titleCounter) titleCounter.innerText = title.length + '/60';
      if (descCounter) descCounter.innerText = desc.length + '/160';
    }

    function insertFormat(before, after, defaultText) {
      const textarea = document.getElementById('postBody');
      if (!textarea) return;
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const selected = textarea.value.substring(start, end) || defaultText;
      const replacement = before + selected + after;
      textarea.value = textarea.value.substring(0, start) + replacement + textarea.value.substring(end);
      textarea.focus();
      textarea.setSelectionRange(start + before.length, start + before.length + selected.length);
      updateLiveStats(textarea.value);
    }

    function insertSpecialBlock(type) {
      if (!type) return;
      let snippet = '';
      if (type === 'callout') {
        snippet = '\n> 💡 **Key Note / Insight:**\n> Here is an important takeaway or pro-tip for the reader.\n\n';
      } else if (type === 'takeaways') {
        snippet = '\n### ⚡ Key Takeaways\n- **Primary Finding:** Clear, actionable insight.\n- **Secondary Finding:** Practical application tip.\n\n';
      } else if (type === 'proscons') {
        snippet = '\n### ⚖️ Comparison: Pros & Cons\n| Advantage (Pros) | Limitation (Cons) |\n| :--- | :--- |\n| ✅ Fast performance | ❌ Requires initial setup |\n| ✅ High security | ❌ Learning curve |\n\n';
      } else if (type === 'table') {
        snippet = '\n| Feature | Plan A | Plan B |\n| :--- | :---: | :---: |\n| Edge Caching | Yes | Yes |\n| Custom Domain | Free | Included |\n\n';
      } else if (type === 'cta') {
        snippet = '\n> 🚀 **Ready to take the next step?**\n> [Click here to subscribe or get started today →](https://example.com)\n\n';
      } else if (type === 'faq') {
        snippet = '\n### ❓ Frequently Asked Questions\n**Q: How does this work?**\nA: It operates seamlessly on Cloudflare global edge network.\n\n';
      }
      insertFormat(snippet, '', '');
    }

    function setEditorMode(mode) {
      const writeBtn = document.getElementById('tabWrite');
      const prevBtn = document.getElementById('tabPreview');
      const textarea = document.getElementById('postBody');
      const preview = document.getElementById('inlinePreviewBox');

      if (!writeBtn || !prevBtn || !textarea || !preview) return;

      if (mode === 'preview') {
        writeBtn.className = 'px-2.5 py-1 rounded text-slate-400 hover:text-white font-medium';
        prevBtn.className = 'px-2.5 py-1 rounded bg-orange-600 text-white font-semibold';
        textarea.classList.add('hidden');
        preview.classList.remove('hidden');
        preview.innerHTML = parseMarkdownSafe(textarea.value || '');
      } else {
        prevBtn.className = 'px-2.5 py-1 rounded text-slate-400 hover:text-white font-medium';
        writeBtn.className = 'px-2.5 py-1 rounded bg-orange-600 text-white font-semibold';
        preview.classList.add('hidden');
        textarea.classList.remove('hidden');
        textarea.focus();
      }
    }

    function updateLiveStats(text) {
      const words = (text || '').trim().split(/\s+/).filter(Boolean).length;
      const mins = Math.max(1, Math.ceil(words / 200));
      const ind = document.getElementById('liveStatsIndicator');
      if (ind) ind.innerText = words + ' words • ' + mins + ' min read';
    }

    function openLivePreviewModal() {
      const modal = document.getElementById('previewModal');
      const heroBox = document.getElementById('modalPreviewHero');
      const contentBox = document.getElementById('modalPreviewContent');
      if (!modal || !heroBox || !contentBox) return;

      const title = document.getElementById('postTitle')?.value || 'Article Title';
      const subtitle = document.getElementById('postSubtitle')?.value || '';
      const image = document.getElementById('postImage')?.value || '';
      const body = document.getElementById('postBody')?.value || '';

      heroBox.innerHTML = `
        <div class="space-y-4 pb-6 border-b border-slate-800">
          <h1 class="text-2xl sm:text-4xl font-extrabold text-white leading-tight font-display">${title}</h1>
          ${subtitle ? `<p class="text-sm sm:text-base text-slate-300 font-sans">${subtitle}</p>` : ''}

        </div>
      `;

      contentBox.innerHTML = parseMarkdownSafe(body || '*No content written yet.*');
      modal.classList.remove('hidden');
    }

    function closePreviewModal() {
      const modal = document.getElementById('previewModal');
      if (modal) modal.classList.add('hidden');
    }

    function setPreviewDevice(device) {
      const wrap = document.getElementById('previewDeviceWrapper');
      const btnDesk = document.getElementById('prevBtnDesktop');
      const btnMob = document.getElementById('prevBtnMobile');
      if (!wrap || !btnDesk || !btnMob) return;

    function saveFullPostForm(id, isNew) {
      const title = document.getElementById('postTitle')?.value?.trim() || '';
      const subtitle = document.getElementById('postSubtitle')?.value?.trim() || '';
      const slug = document.getElementById('postSlug')?.value?.trim() || '';
      const categoryId = document.getElementById('postCat')?.value || '';
      const tags = (document.getElementById('postTags')?.value || '')
        .split(',')
        .map(t => t.trim())
        .filter(Boolean);
      const excerpt = document.getElementById('postExcerpt')?.value?.trim() || '';
      const content = document.getElementById('postBody')?.value || '';
      const status = document.getElementById('postStatus')?.value || 'published';
      const authorId = document.getElementById('postAuthor')?.value || '1';
      const isFeatured = !!document.getElementById('postIsFeatured')?.checked;
      const isTrending = !!document.getElementById('postIsTrending')?.checked;
      const allowComments = !!document.getElementById('postAllowComments')?.checked;
      const showFeaturedImageInPost = !!document.getElementById('postShowHeroInHeader')?.checked;
      const featuredImage = document.getElementById('postImage')?.value?.trim() || '';
      const featuredImageAlt = document.getElementById('postImageAlt')?.value?.trim() || '';
      const featuredImageCaption = document.getElementById('postImageCaption')?.value?.trim() || '';
      const featuredImageCredit = document.getElementById('postImageCredit')?.value?.trim() || '';
      const seoTitle = document.getElementById('postSeoTitle')?.value?.trim() || '';
      const metaDescription = document.getElementById('postSeoDesc')?.value?.trim() || '';

      if (!title || !slug) {
        showToast('Please enter both Title and Permalink Slug', false);
        return;
      }

      if (isNew) {
        APP_DATA.posts.unshift({
          id: 'post_' + Date.now(),
          title,
          subtitle,
          slug,
          categoryId,
          tags,
          excerpt,
          content,
          status,
          authorId,
          isFeatured,
          isTrending,
          allowComments,
          showFeaturedImageInPost,
          featuredImage,
          featuredImageAlt,
          featuredImageCaption,
          featuredImageCredit,
          seoTitle,
          metaDescription,
          publishedAt: new Date().toISOString(),
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
        });
      } else {
        const p = APP_DATA.posts.find(item => item.id === id);
        if (p) {
          p.title = title;
          p.subtitle = subtitle;
          p.slug = slug;
          p.categoryId = categoryId;
          p.tags = tags;
          p.excerpt = excerpt;
          p.content = content;
          p.status = status;
          p.authorId = authorId;
          p.isFeatured = isFeatured;
          p.isTrending = isTrending;
          p.allowComments = allowComments;
          p.showFeaturedImageInPost = showFeaturedImageInPost;
          p.featuredImage = featuredImage;
          p.featuredImageAlt = featuredImageAlt;
          p.featuredImageCaption = featuredImageCaption;
          p.featuredImageCredit = featuredImageCredit;
          p.seoTitle = seoTitle;
          p.metaDescription = metaDescription;
          p.updatedAt = new Date().toISOString();
        }
      }

      saveState();
      editingPostId = null;
      showToast('Article saved! Click "Push to GitHub" to publish live.');
      switchTab('posts');
    }

    function deletePost(id) {
      if (!confirm('Are you sure you want to move this article to trash?')) return;
      APP_DATA.posts = APP_DATA.posts.filter(p => p.id !== id);
      saveState();
      showToast('Article removed');
      renderPosts(document.getElementById('mainContent'));
    }

              <input id="setPostsPerPage" type="number" value="${APP_DATA.settings?.postsPerPage || 9}" class="w-32 px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs outline-none" />
            </div>
          </div>
        </div>
      `;
    }

    function saveGeneralSettingsForm() {
      if (!APP_DATA.settings) APP_DATA.settings = {};
      APP_DATA.settings.siteName = document.getElementById('setSiteName')?.value?.trim() || 'Astro Blog';
      APP_DATA.settings.tagline = document.getElementById('setTagline')?.value?.trim() || '';
      APP_DATA.settings.description = document.getElementById('setDescription')?.value?.trim() || '';
      APP_DATA.settings.logoUrl = document.getElementById('setLogoUrl')?.value?.trim() || '';
      APP_DATA.settings.faviconUrl = document.getElementById('setFaviconUrl')?.value?.trim() || '';
      APP_DATA.settings.postsPerPage = parseInt(document.getElementById('setPostsPerPage')?.value || '9') || 9;

      const titleEl = document.getElementById('headerSiteName');
      if (titleEl) titleEl.innerText = APP_DATA.settings.siteName;
      saveState();
      showToast('Settings saved! Click "Push to GitHub" to publish.');
    }

    // 13. SEO & ANALYTICS
    function renderSeo(container) {
      const seo = APP_DATA.settings?.defaultSeo || {};
      const twitter = APP_DATA.settings?.socialLinks?.twitter || '';

      container.innerHTML = `
        <div class="space-y-6 max-w-3xl">
          <div class="flex items-center justify-between pb-4 border-b border-slate-800">
            <div>
              <h1 class="text-xl sm:text-2xl font-bold text-white">SEO & Social Meta</h1>
              <p class="text-xs text-slate-400 mt-1">Configure default search engine rankings and social cards.</p>
            </div>
            <button type="button" onclick="saveSeoForm()" class="px-4 py-2 rounded-xl bg-orange-600 hover:bg-orange-500 text-white font-semibold text-xs shadow-md">
              💾 Save SEO
            </button>
          </div>

          <div class="p-4 sm:p-6 rounded-2xl bg-[#0f172a] border border-slate-800 space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Default Meta Title</label>
              <input id="seoTitle" value="${(seo.metaTitle || APP_DATA.settings?.siteName || '').replace(/"/g, '&quot;')}" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs sm:text-sm outline-none" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Default Meta Description</label>
              <textarea id="seoDesc" rows="3" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs outline-none">${seo.metaDescription || APP_DATA.settings?.description || ''}</textarea>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Default Social Share Image (OG Card URL)</label>
              <input id="seoOgImage" value="${seo.ogImage || ''}" class="w-full px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs outline-none" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Twitter / X Handle</label>
              <input id="seoTwitter" value="${twitter}" class="w-full px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs outline-none" placeholder="@yourbrand" />
            </div>
          </div>
        </div>
      `;
    }

    function saveSeoForm() {
      if (!APP_DATA.settings) APP_DATA.settings = {};
      if (!APP_DATA.settings.defaultSeo) APP_DATA.settings.defaultSeo = {};
      APP_DATA.settings.defaultSeo.metaTitle = document.getElementById('seoTitle')?.value?.trim() || '';
      APP_DATA.settings.defaultSeo.metaDescription = document.getElementById('seoDesc')?.value?.trim() || '';
      APP_DATA.settings.defaultSeo.ogImage = document.getElementById('seoOgImage')?.value?.trim() || '';

      if (!APP_DATA.settings.socialLinks) APP_DATA.settings.socialLinks = {};
      APP_DATA.settings.socialLinks.twitter = document.getElementById('seoTwitter')?.value?.trim() || '';

      saveState();
      showToast('SEO settings saved! Click "Push to GitHub" to publish.');
    }

    // 14. GITHUB DIRECT COMMITTER
    async function commitAllToGitHub() {
      const token = localStorage.getItem('astro_sveltia_gh_token') || '';
      const owner = localStorage.getItem('astro_sveltia_gh_user') || APP_DATA.githubUser;
      const repo = localStorage.getItem('astro_sveltia_gh_repo') || APP_DATA.githubRepo;

      if (!token) {
        promptEditGithubToken();
        return;
      }

      const syncBtn = document.getElementById('btnSyncGh');
      if (syncBtn) {
        syncBtn.disabled = true;
        syncBtn.innerHTML = '<span>⏳</span><span>Pushing...</span>';
      }

      try {
        await pushFileDirect(owner, repo, token, 'src/data/settings.json', JSON.stringify(APP_DATA.settings, null, 2), 'chore: update site settings from Admin Studio');
        await pushFileDirect(owner, repo, token, 'src/content/categories/categories.json', JSON.stringify(APP_DATA.categories, null, 2), 'content: update categories taxonomy');
        await pushFileDirect(owner, repo, token, 'src/data/menus.json', JSON.stringify({ items: APP_DATA.menus }, null, 2), 'structure: update navigation menus');
        await pushFileDirect(owner, repo, token, 'src/data/redirects.json', JSON.stringify({ rules: APP_DATA.redirects }, null, 2), 'routing: update 301 url redirects');

        for (const p of (APP_DATA.posts || [])) {
          const frontmatter = `---
title: "${(p.title || '').replace(/"/g, '\\"')}"
subtitle: "${(p.subtitle || '').replace(/"/g, '\\"')}"
slug: "${p.slug}"
publishedAt: "${p.publishedAt || new Date().toISOString()}"
status: "${p.status || 'published'}"
category: "${p.categoryId || ''}"
tags: ${JSON.stringify(p.tags || [])}
author: "${p.authorId || 'Admin'}"
featuredImage: "${p.featuredImage || ''}"
featuredImageAlt: "${(p.featuredImageAlt || '').replace(/"/g, '\\"')}"
featuredImageCaption: "${(p.featuredImageCaption || '').replace(/"/g, '\\"')}"
featuredImageCredit: "${(p.featuredImageCredit || '').replace(/"/g, '\\"')}"
showFeaturedImageInPost: ${p.showFeaturedImageInPost !== false}
isFeatured: ${!!p.isFeatured}
isTrending: ${!!p.isTrending}
allowComments: ${p.allowComments !== false}
excerpt: "${(p.excerpt || '').replace(/"/g, '\\"')}"
seoTitle: "${(p.seoTitle || '').replace(/"/g, '\\"')}"
metaDescription: "${(p.metaDescription || '').replace(/"/g, '\\"')}"
---

${p.content || ''}
`;
          await pushFileDirect(owner, repo, token, `src/content/blog/${p.slug}.md`, frontmatter, `content: update article "${p.title}"`);
        }

        showToast('🚀 Pushed successfully to GitHub! Live site is rebuilding now.');
      } catch (err) {
        console.error(err);
        showToast('Failed to push: ' + (err.message || 'Check GitHub token'), false);
      } finally {
        if (syncBtn) {
          syncBtn.disabled = false;
          syncBtn.innerHTML = '<span>🚀</span><span class="hidden sm:inline">Push to GitHub</span><span class="sm:hidden">Push</span>';
        }
      }
    }

    async function pushFileDirect(owner, repo, token, path, content, message) {
      let sha = null;
      try {
        const getRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github.v3+json',
          },
        });
        if (getRes.ok) {
          const getData = await getRes.json();
          sha = getData.sha;
        }
      } catch (e) {
        // file does not exist yet
      }

      const body = {
        message,
        content: btoa(unescape(encodeURIComponent(content))),
      };
      if (sha) body.sha = sha;

      const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
        method: 'PUT',
        headers: {
          Authorization: `Bearer ${token}`,
          Accept: 'application/vnd.github.v3+json',
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(body),
      });

      if (!putRes.ok) {
        const errJson = await putRes.json().catch(() => ({}));
        throw new Error(errJson.message || `HTTP ${putRes.status}`);
      }
    }

    function promptEditGithubToken() {
      const current = localStorage.getItem('astro_sveltia_gh_token') || '';
      const input = prompt('Enter your GitHub Personal Access Token (classic token with "repo" scope):', current);
      if (input !== null && input.trim()) {
        localStorage.setItem('astro_sveltia_gh_token', input.trim());
        showToast('GitHub token saved in your browser!');
      }
    }

    // Startup Initialization
    function initAdminStudio() {
      try {
        renderNavbars();
        switchTab('dashboard');
      } catch (err) {
        console.error('Initialization error:', err);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initAdminStudio);
    } else {
      initAdminStudio();
    }
  </script>
