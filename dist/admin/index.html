<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Admin Studio – Astro Blog CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    html, body {
      min-height: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #080d1a !important;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
    }
    #appWrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #080d1a;
    }
    #mainContent {
      flex: 1 1 auto;
      min-height: calc(100vh - 56px);
      background-color: #080d1a;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0b1120; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
    .prose-dark h1, .prose-dark h2, .prose-dark h3 { color: #f8fafc; font-weight: 700; margin-top: 1.25rem; margin-bottom: 0.5rem; }
    .prose-dark p { margin-bottom: 1rem; line-height: 1.7; color: #cbd5e1; }
    .prose-dark ul, .prose-dark ol { margin-left: 1.5rem; margin-bottom: 1rem; color: #cbd5e1; }
    .prose-dark code { background: #1e293b; color: #fb923c; padding: 0.2rem 0.4rem; border-radius: 4px; font-family: monospace; font-size: 0.875rem; }
    .prose-dark pre { background: #0f172a; padding: 1rem; border-radius: 8px; border: 1px solid #1e293b; overflow-x: auto; margin-bottom: 1rem; }
    .prose-dark blockquote { border-left: 4px solid #ea580c; padding-left: 1rem; color: #94a3b8; font-style: italic; margin-bottom: 1rem; }
  </style>
</head>
<body class="bg-[#080d1a] text-slate-100 antialiased selection:bg-orange-600 selection:text-white">

  <div id="appWrapper">
    <!-- 1. Top Header Bar (Mobile Responsive) -->
    <header class="h-14 border-b border-slate-800 bg-[#0b101c] px-3 sm:px-5 flex items-center justify-between sticky top-0 z-40 shrink-0">
      <div class="flex items-center gap-2 sm:gap-4">
        <!-- Mobile Hamburger Button -->
        <button type="button" onclick="toggleMobileDrawer()" class="lg:hidden p-2 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition-colors" aria-label="Toggle Menu">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>

        <a href="/" class="flex items-center gap-2 sm:gap-2.5 group">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center font-black text-white text-base shadow-lg shadow-orange-600/30 shrink-0">
            A
          </div>
          <div class="flex flex-col">
            <span class="font-bold text-xs sm:text-sm text-white group-hover:text-orange-400 transition-colors truncate max-w-[120px] sm:max-w-xs" id="headerSiteName">Astro Blog CMS</span>
            <span class="text-[9px] sm:text-[10px] text-slate-400 font-mono">Admin Studio</span>
          </div>
        </a>
        <span class="hidden md:inline text-slate-700">|</span>
        <a href="/" target="_blank" class="hidden md:flex text-xs text-slate-400 hover:text-white items-center gap-1 transition-colors">
          <span>🌐 View Live Site</span>
        </a>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <!-- Push To GitHub Action -->
        <button type="button" onclick="commitAllToGitHub()" id="btnSyncGh" class="flex items-center gap-1.5 sm:gap-2 px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-semibold text-xs transition-all shadow-md">
          <span>🚀</span>
          <span class="hidden sm:inline">Push to GitHub</span>
          <span class="sm:hidden">Push</span>
        </button>

        <!-- Sveltia Alternative Link -->
        <a href="./sveltia.html" target="_blank" class="hidden sm:inline-flex px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-medium text-xs transition-colors border border-slate-700">
          Sveltia CMS →
        </a>

        <!-- User Badge -->
        <div class="flex items-center gap-1.5 px-2 py-1 rounded bg-slate-900 border border-slate-800 text-xs">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="text-slate-300 hidden sm:inline">Howdy, </span>
          <strong class="text-white text-[11px] sm:text-xs">Admin</strong>
        </div>
      </div>
    </header>

    <!-- 2. Mobile Drawer Navigation Overlay -->
    <div id="mobileDrawer" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm lg:hidden transition-all">
      <div class="w-72 bg-[#0b101c] border-r border-slate-800 h-full p-4 flex flex-col justify-between overflow-y-auto">
        <div class="space-y-4">
          <div class="flex items-center justify-between pb-3 border-b border-slate-800">
            <div class="flex items-center gap-2">
              <div class="w-6 h-6 rounded bg-orange-600 flex items-center justify-center font-bold text-white text-xs">A</div>
              <span class="font-bold text-sm text-white">Menu Navigation</span>
            </div>
            <button type="button" onclick="toggleMobileDrawer()" class="p-1 rounded text-slate-400 hover:text-white">✕</button>
          </div>
          <nav class="space-y-1 text-xs" id="mobileNavContainer">
            <!-- Populated by JavaScript -->
          </nav>
        </div>

        <div class="p-3 bg-slate-900/80 rounded-xl border border-slate-800 text-xs space-y-2 mt-4">
          <div class="text-[10px] text-slate-400 font-mono">Repo: <strong class="text-white">my-astro-blog</strong></div>
          <button type="button" onclick="promptEditGithubToken()" class="w-full text-center py-1.5 rounded bg-slate-800 text-slate-200 text-xs font-medium">
            🔑 Set GitHub Token
          </button>
        </div>
      </div>
    </div>

    <!-- 3. Main Workspace: Desktop Sidebar + Content Pane -->
    <div class="flex-1 flex overflow-hidden">
      <!-- Desktop Left Sidebar -->
      <aside class="hidden lg:flex w-60 border-r border-slate-800 bg-[#0b101c] flex-col justify-between shrink-0 p-3 overflow-y-auto">
        <nav class="space-y-1 text-xs" id="desktopNavContainer">
          <!-- Rendered dynamically -->
        </nav>

        <div class="p-3 bg-slate-900/80 rounded-xl border border-slate-800 space-y-2 text-xs">
          <div class="flex items-center justify-between text-slate-400 text-[10px]">
            <span class="font-mono">GitHub Repo:</span>
            <span class="font-semibold text-white truncate max-w-[100px]">my-astro-blog</span>
          </div>
          <button type="button" onclick="promptEditGithubToken()" class="w-full text-center py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] transition-colors">
            🔑 Update GitHub Token
          </button>
        </div>
      </aside>

      <!-- Main Content Panel -->
      <main class="flex-1 p-3 sm:p-6 lg:p-8 overflow-y-auto max-w-7xl w-full mx-auto" id="mainContent">
      </main>
    </div>
  </div>

  <!-- 4. Global Live Preview Modal (Mobile & Desktop View) -->
  <div id="previewModal" class="fixed inset-0 z-50 hidden bg-black/85 backdrop-blur-md flex flex-col p-2 sm:p-6">
    <div class="bg-[#0b101c] border border-slate-800 rounded-2xl flex-1 flex flex-col overflow-hidden max-w-5xl w-full mx-auto shadow-2xl">
      <div class="p-3 sm:p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/80">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
          <span class="font-bold text-xs sm:text-sm text-white">Live Article Preview</span>
        </div>
        <div class="flex items-center gap-2">
          <div class="flex bg-slate-800 p-0.5 rounded-lg text-xs">
            <button type="button" onclick="setPreviewDevice('desktop')" id="prevBtnDesktop" class="px-2.5 py-1 rounded-md bg-orange-600 text-white font-medium">Desktop</button>
            <button type="button" onclick="setPreviewDevice('mobile')" id="prevBtnMobile" class="px-2.5 py-1 rounded-md text-slate-400 hover:text-white font-medium">Mobile</button>
          </div>
          <button type="button" onclick="closePreviewModal()" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 text-sm font-bold">✕</button>
        </div>
      </div>
      <div class="flex-1 overflow-y-auto p-4 sm:p-8 flex justify-center bg-[#080d1a]" id="previewViewportContainer">
        <div id="previewDeviceWrapper" class="w-full max-w-3xl bg-[#0b101c] rounded-xl border border-slate-800 p-6 sm:p-8 overflow-y-auto space-y-6">
          <div id="modalPreviewHero"></div>
          <div id="modalPreviewContent" class="prose-dark"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 5. Toast Notification -->
  <div id="toastBox" class="fixed bottom-4 sm:bottom-6 right-4 sm:right-6 z-50 hidden px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs sm:text-sm shadow-2xl flex items-center gap-3">
    <span id="toastIcon">✓</span>
    <span id="toastMsg">Action completed</span>
  </div>

    var APP_DATA = {
      settings: {},
      posts: [],
      categories: [],
      tags: [],
      pages: [],
      menus: [],
      users: [],
      redirects: [],
      githubUser: "",
      githubRepo: ""
    };

    function decodeBase64Utf8(base64) {
      if (!base64) return '';
      try {
        var binary = atob(base64);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return new TextDecoder('utf-8').decode(bytes);
      } catch (e) {
        try {
          return decodeURIComponent(escape(atob(base64)));
        } catch (e2) {
          return atob(base64);
        }
      }
    }

    try {
      if (RAW_BASE64) {
        var jsonStr = decodeBase64Utf8(RAW_BASE64);
        var parsed = JSON.parse(jsonStr);
        if (parsed && typeof parsed === 'object') {
          APP_DATA = parsed;
        }
      }
    } catch (e) {
      console.error('Failed to parse base64 payload', e);
    }

    // Defensive Data Guarantees
    if (!APP_DATA.settings || typeof APP_DATA.settings !== 'object') APP_DATA.settings = {};
    if (!Array.isArray(APP_DATA.posts)) APP_DATA.posts = [];
    if (!Array.isArray(APP_DATA.categories)) APP_DATA.categories = [];
    if (!Array.isArray(APP_DATA.tags)) APP_DATA.tags = [];
    if (!Array.isArray(APP_DATA.pages)) APP_DATA.pages = [];
    if (!Array.isArray(APP_DATA.menus)) APP_DATA.menus = [];
    if (!Array.isArray(APP_DATA.users)) APP_DATA.users = [];
    if (!Array.isArray(APP_DATA.redirects)) APP_DATA.redirects = [];

    // Load localStorage cached edits if any
    try {
      var cached = localStorage.getItem('astro_edge_cms_state');
      if (cached) {
        var p = JSON.parse(cached);
        if (p && typeof p === 'object') {
          if (p.settings) APP_DATA.settings = Object.assign(APP_DATA.settings, p.settings);
          if (Array.isArray(p.posts) && p.posts.length > 0) APP_DATA.posts = p.posts;
          if (Array.isArray(p.categories) && p.categories.length > 0) APP_DATA.categories = p.categories;
          if (Array.isArray(p.tags)) APP_DATA.tags = p.tags;
          if (Array.isArray(p.pages) && p.pages.length > 0) APP_DATA.pages = p.pages;
          if (Array.isArray(p.menus) && p.menus.length > 0) APP_DATA.menus = p.menus;
          if (Array.isArray(p.users) && p.users.length > 0) APP_DATA.users = p.users;
          if (Array.isArray(p.redirects)) APP_DATA.redirects = p.redirects;
        }
      }
    } catch (err) {
      console.warn('Cache load ignored:', err);
    }

    function saveState() {
      try {
        localStorage.setItem('astro_edge_cms_state', JSON.stringify({
          settings: APP_DATA.settings,
          posts: APP_DATA.posts,
          categories: APP_DATA.categories,
          tags: APP_DATA.tags,
          pages: APP_DATA.pages,
          menus: APP_DATA.menus,
          users: APP_DATA.users,
          redirects: APP_DATA.redirects
        }));
      } catch (e) {
        console.error('Failed to save localStorage:', e);
      }
    }

    function showToast(msg, isSuccess) {
      if (isSuccess === undefined) isSuccess = true;
      var box = document.getElementById('toastBox');
      var icon = document.getElementById('toastIcon');
      var text = document.getElementById('toastMsg');
      if (!box || !icon || !text) return;
      icon.innerText = isSuccess ? '✓' : '⚠️';
      icon.className = isSuccess ? 'text-emerald-400 font-bold' : 'text-rose-400 font-bold';
      text.innerText = msg;
      box.classList.remove('hidden');
      setTimeout(function() { box.classList.add('hidden'); }, 3500);
    }

    function toggleMobileDrawer() {
      var d = document.getElementById('mobileDrawer');
      if (d) d.classList.toggle('hidden');
    }

    function parseMarkdownSafe(md) {
      if (typeof marked !== 'undefined' && marked && typeof marked.parse === 'function') {
        try {
          return marked.parse(md || '');
        } catch (e) {
          console.error(e);
        }
      }
      return (md || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\n/g, '<br />');
    }

    function renderNavbars() {
      var desktop = document.getElementById('desktopNavContainer');
      var mobile = document.getElementById('mobileNavContainer');

      var html = NAV_ITEMS.map(function(item) {
        return '<button type="button" onclick="switchTab(&apos;' + item.id + '&apos;)" class="nav-btn nav-btn-' + item.id + ' w-full flex items-center gap-3 px-3 py-2.5 rounded-lg font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition-colors text-left">' +
          '<span>' + item.icon + '</span>' +
          '<span>' + item.label + '</span>' +
        '</button>';
      }).join('');

      if (desktop) desktop.innerHTML = html;
      if (mobile) mobile.innerHTML = html;
    }

    function switchTab(tab) {
      activeTab = tab;
      currentEditingPostId = null;
      isNewPostMode = false;

    function handleTitleInput(val) {
      if (isNewPostMode) {
        var slug = val.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        var slugEl = document.getElementById('postSlug');
        if (slugEl) slugEl.value = slug;
        var serpSlug = document.getElementById('serpSlugPreview');
        if (serpSlug) serpSlug.innerText = slug || 'article';
      }
      updateSerpPreview();
    }

    function regenerateSlugFromTitle() {
      var titleEl = document.getElementById('postTitle');
      var slugEl = document.getElementById('postSlug');
      if (titleEl && slugEl) {
        var newSlug = (titleEl.value || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'untitled-post';
        slugEl.value = newSlug;
        var serpSlug = document.getElementById('serpSlugPreview');
        if (serpSlug) serpSlug.innerText = newSlug;
      }
    }

    function setEditorVisualMode(mode) {
      var btnVisual = document.getElementById('modeBtnVisual');
      var btnMarkdown = document.getElementById('modeBtnMarkdown');
      var visContainer = document.getElementById('visualBlocksContainer');
      var rawContainer = document.getElementById('rawMarkdownContainer');
      var rawTextarea = document.getElementById('postRawMarkdown');
      var visTextarea = document.getElementById('postBody');

      if (!visContainer || !rawContainer) return;

      if (mode === 'markdown') {
        if (btnVisual) btnVisual.className = 'px-3 py-1 rounded-lg text-slate-400 hover:text-white flex items-center gap-1.5';
        if (btnMarkdown) btnMarkdown.className = 'px-3 py-1 rounded-lg bg-orange-600 text-white font-bold flex items-center gap-1.5 shadow-sm';
        visContainer.classList.add('hidden');
        rawContainer.classList.remove('hidden');
        if (rawTextarea && visTextarea) rawTextarea.value = visTextarea.value;
      } else {
        if (btnMarkdown) btnMarkdown.className = 'px-3 py-1 rounded-lg text-slate-400 hover:text-white flex items-center gap-1.5';
        if (btnVisual) btnVisual.className = 'px-3 py-1 rounded-lg bg-orange-600 text-white font-bold flex items-center gap-1.5 shadow-sm';
        rawContainer.classList.add('hidden');
        visContainer.classList.remove('hidden');
        if (visTextarea && rawTextarea && rawTextarea.value) visTextarea.value = rawTextarea.value;
      }
    }

    function openInsertElementModal(idx) {
      var modal = document.getElementById('insertElementModal');
      if (modal) modal.classList.remove('hidden');
    }

    function closeInsertElementModal() {
      var modal = document.getElementById('insertElementModal');
      if (modal) modal.classList.add('hidden');
    }

    function insertRawText(before, after, defaultText) {
      var textarea = document.getElementById('postBody');
      if (!textarea) return;
      var start = textarea.selectionStart;
      var end = textarea.selectionEnd;
      var selected = textarea.value.substring(start, end) || defaultText;
      var replacement = before + selected + after;
      textarea.value = textarea.value.substring(0, start) + replacement + textarea.value.substring(end);
      textarea.focus();
      textarea.setSelectionRange(start + before.length, start + before.length + selected.length);
      updateLiveStats(textarea.value);
    }

    function saveCurrentPostForm() {
      var title = document.getElementById('postTitle') ? document.getElementById('postTitle').value.trim() : '';
      var subtitle = document.getElementById('postSubtitle') ? document.getElementById('postSubtitle').value.trim() : '';
      var slug = document.getElementById('postSlug') ? document.getElementById('postSlug').value.trim() : '';
      var categoryId = document.getElementById('postCat') ? document.getElementById('postCat').value : '';
      var tags = (document.getElementById('postTags') ? document.getElementById('postTags').value : '')
        .split(',')
        .map(function(t) { return t.trim(); })
        .filter(Boolean);
      var excerpt = document.getElementById('postExcerpt') ? document.getElementById('postExcerpt').value.trim() : '';
      var content = document.getElementById('postBody') ? document.getElementById('postBody').value : '';
      var status = document.getElementById('postStatus') ? document.getElementById('postStatus').value : 'published';
      var authorId = document.getElementById('postAuthor') ? document.getElementById('postAuthor').value : '1';
      var isFeatured = document.getElementById('postIsFeatured') ? !!document.getElementById('postIsFeatured').checked : false;
      var isTrending = document.getElementById('postIsTrending') ? !!document.getElementById('postIsTrending').checked : false;
      var allowComments = document.getElementById('postAllowComments') ? !!document.getElementById('postAllowComments').checked : true;
      var showFeaturedImageInPost = document.getElementById('postShowHeroInHeader') ? !!document.getElementById('postShowHeroInHeader').checked : true;
      var featuredImage = document.getElementById('postImage') ? document.getElementById('postImage').value.trim() : '';
      var featuredImageAlt = document.getElementById('postImageAlt') ? document.getElementById('postImageAlt').value.trim() : '';
      var featuredImageCaption = document.getElementById('postImageCaption') ? document.getElementById('postImageCaption').value.trim() : '';
      var featuredImageCredit = document.getElementById('postImageCredit') ? document.getElementById('postImageCredit').value.trim() : '';
      var seoTitle = document.getElementById('postSeoTitle') ? document.getElementById('postSeoTitle').value.trim() : '';
      var metaDescription = document.getElementById('postSeoDesc') ? document.getElementById('postSeoDesc').value.trim() : '';

      if (!title || !slug) {
        showToast('Please enter both Title and Permalink Slug', false);
        return;
      }

      if (isNewPostMode) {
        APP_DATA.posts.unshift({
          id: 'post_' + Date.now(),
          title: title,
          subtitle: subtitle,
          slug: slug,
          categoryId: categoryId,
          tags: tags,
          excerpt: excerpt,
          content: content,
          status: status,
          authorId: authorId,
          isFeatured: isFeatured,
          isTrending: isTrending,
          allowComments: allowComments,
          showFeaturedImageInPost: showFeaturedImageInPost,
          featuredImage: featuredImage,
          featuredImageAlt: featuredImageAlt,
          featuredImageCaption: featuredImageCaption,
          featuredImageCredit: featuredImageCredit,
          seoTitle: seoTitle,
          metaDescription: metaDescription,
          publishedAt: new Date().toISOString(),
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        });
      } else {
        var p = (APP_DATA.posts || []).find(function(item) { return item.id === currentEditingPostId; });
        if (p) {
          p.title = title;
          p.subtitle = subtitle;
          p.slug = slug;
          p.categoryId = categoryId;
          p.tags = tags;
          p.excerpt = excerpt;
          p.content = content;
          p.status = status;
          p.authorId = authorId;
          p.isFeatured = isFeatured;
          p.isTrending = isTrending;
          p.allowComments = allowComments;
          p.showFeaturedImageInPost = showFeaturedImageInPost;
          p.featuredImage = featuredImage;
          p.featuredImageAlt = featuredImageAlt;
          p.featuredImageCaption = featuredImageCaption;
          p.featuredImageCredit = featuredImageCredit;
          p.seoTitle = seoTitle;
          p.metaDescription = metaDescription;
          p.updatedAt = new Date().toISOString();
        }
      }

      saveState();
      currentEditingPostId = null;
      isNewPostMode = false;
      showToast('Article saved! Click "Push to GitHub" to publish live.');
      switchTab('posts');
    }

    function moveFooterLinkInAdmin(id, dir) {
      if (!APP_DATA.settings || !APP_DATA.settings.footer || !Array.isArray(APP_DATA.settings.footer.quickLinks)) return;
      var list = APP_DATA.settings.footer.quickLinks;
      var idx = list.findIndex(function(l) { return l.id === id; });
      if (idx === -1) return;
      if (dir === 'up' && idx > 0) {
        var temp = list[idx];
        list[idx] = list[idx - 1];
        list[idx - 1] = temp;
      } else if (dir === 'down' && idx < list.length - 1) {
        var temp = list[idx];
        list[idx] = list[idx + 1];
        list[idx + 1] = temp;
      }
      saveState();
      renderFooterCustomizer(document.getElementById('mainContent'));
    }

    // 14. GITHUB DIRECT COMMITTER
    async function commitAllToGitHub() {
      var token = localStorage.getItem('astro_sveltia_gh_token') || '';
      var owner = localStorage.getItem('astro_sveltia_gh_user') || APP_DATA.githubUser;
      var repo = localStorage.getItem('astro_sveltia_gh_repo') || APP_DATA.githubRepo;

      if (!token) {
        promptEditGithubToken();
        return;
      }

      var syncBtn = document.getElementById('btnSyncGh');
      if (syncBtn) {
        syncBtn.disabled = true;
        syncBtn.innerHTML = '<span>⏳</span><span>Pushing...</span>';
      }

      try {
        await pushFileDirect(owner, repo, token, 'src/data/settings.json', JSON.stringify(APP_DATA.settings, null, 2), 'chore: update site settings from Admin Studio');
        await pushFileDirect(owner, repo, token, 'src/content/categories/categories.json', JSON.stringify(APP_DATA.categories, null, 2), 'content: update categories taxonomy');
        await pushFileDirect(owner, repo, token, 'src/data/menus.json', JSON.stringify({ items: APP_DATA.menus }, null, 2), 'structure: update navigation menus');
        await pushFileDirect(owner, repo, token, 'src/data/redirects.json', JSON.stringify({ rules: APP_DATA.redirects }, null, 2), 'routing: update 301 url redirects');

        var postsList = APP_DATA.posts || [];
        for (var i = 0; i < postsList.length; i++) {
          var p = postsList[i];
          var frontmatter = '---\n' +
            'title: "' + (p.title || '').replace(/"/g, '\\"') + '"\n' +
            'subtitle: "' + (p.subtitle || '').replace(/"/g, '\\"') + '"\n' +
            'slug: "' + p.slug + '"\n' +
            'publishedAt: "' + (p.publishedAt || new Date().toISOString()) + '"\n' +
            'status: "' + (p.status || 'published') + '"\n' +
            'category: "' + (p.categoryId || '') + '"\n' +
            'tags: ' + JSON.stringify(p.tags || []) + '\n' +
            'author: "' + (p.authorId || 'Admin') + '"\n' +
            'featuredImage: "' + (p.featuredImage || '') + '"\n' +
            'featuredImageAlt: "' + (p.featuredImageAlt || '').replace(/"/g, '\\"') + '"\n' +
            'featuredImageCaption: "' + (p.featuredImageCaption || '').replace(/"/g, '\\"') + '"\n' +
            'featuredImageCredit: "' + (p.featuredImageCredit || '').replace(/"/g, '\\"') + '"\n' +
            'showFeaturedImageInPost: ' + (p.showFeaturedImageInPost !== false) + '\n' +
            'isFeatured: ' + (!!p.isFeatured) + '\n' +
            'isTrending: ' + (!!p.isTrending) + '\n' +
            'allowComments: ' + (p.allowComments !== false) + '\n' +
            'excerpt: "' + (p.excerpt || '').replace(/"/g, '\\"') + '"\n' +
            'seoTitle: "' + (p.seoTitle || '').replace(/"/g, '\\"') + '"\n' +
            'metaDescription: "' + (p.metaDescription || '').replace(/"/g, '\\"') + '"\n' +
            '---\n\n' +
            (p.content || '');

          await pushFileDirect(owner, repo, token, 'src/content/blog/' + p.slug + '.md', frontmatter, 'content: update article "' + p.title + '"');
        }

        showToast('🚀 Pushed successfully to GitHub! Live site is rebuilding now.');
      } catch (err) {
        console.error(err);
        showToast('Failed to push: ' + (err.message || 'Check GitHub token'), false);
      } finally {
        if (syncBtn) {
          syncBtn.disabled = false;
          syncBtn.innerHTML = '<span>🚀</span><span class="hidden sm:inline">Push to GitHub</span><span class="sm:hidden">Push</span>';
        }
      }
    }

    async function pushFileDirect(owner, repo, token, path, content, message) {
      var sha = null;
      try {
        var getRes = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, {
          headers: {
            Authorization: 'Bearer ' + token,
            Accept: 'application/vnd.github.v3+json'
          }
        });
        if (getRes.ok) {
          var getData = await getRes.json();
          sha = getData.sha;
        }
      } catch (e) {}

      var body = {
        message: message,
        content: btoa(unescape(encodeURIComponent(content)))
      };
      if (sha) body.sha = sha;

      var putRes = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, {
        method: 'PUT',
        headers: {
          Authorization: 'Bearer ' + token,
          Accept: 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });

      if (!putRes.ok) {
        var errJson = await putRes.json().catch(function() { return {}; });
        throw new Error(errJson.message || ('HTTP ' + putRes.status));
      }
    }

    function promptEditGithubToken() {
      var current = localStorage.getItem('astro_sveltia_gh_token') || '';
      var input = prompt('Enter your GitHub Personal Access Token (classic token with "repo" scope):', current);
      if (input !== null && input.trim()) {
        localStorage.setItem('astro_sveltia_gh_token', input.trim());
        showToast('GitHub token saved in your browser!');
      }
    }

    // Direct Instant Initialization with DOM safeguard
    function initStudio() {
      try {
        renderNavbars();
        switchTab('dashboard');
      } catch (e) {
        console.error('Studio init error:', e);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initStudio);
    } else {
      initStudio();
    }
